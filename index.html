<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memoland | Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8dee8;
      --soft: #f5f7fb;
      --brand: #e21882;
      --brand-dark: #a4135f;
      --mint: #cce9e6;
      --white: #fff;
      --ok: #087443;
      --bad: #b42318;
      --warn: #b54708;
      --repression: #4285f4;
      --resistance: #db4437;
      --header-height: 118px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--mint);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
      overflow: hidden;
    }

    body.dialog-open {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    button.active {
      background: var(--ink);
      color: var(--white);
      border-color: var(--ink);
    }

    .map-app {
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      grid-template-rows: var(--header-height) minmax(0, 1fr) auto;
      height: 100vh;
      min-height: 100vh;
    }

    .map-app.sidebar-hidden {
      grid-template-columns: minmax(0, 1fr);
    }

    .map-app.sidebar-hidden .sidebar {
      display: none;
    }

    .map-app.sidebar-hidden .map-wrap {
      grid-column: 1;
    }

    .logo-strip {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      height: var(--header-height);
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(31, 41, 51, 0.12);
      box-shadow: 0 10px 24px rgba(31, 41, 51, 0.1);
      z-index: 950;
      overflow: visible;
    }

    .sidebar {
      grid-column: 1;
      grid-row: 2;
      min-height: 0;
      overflow: auto;
      background: rgba(255, 255, 255, 0.94);
      border-right: 1px solid rgba(31, 41, 51, 0.12);
      box-shadow: 12px 0 32px rgba(31, 41, 51, 0.12);
      padding: 18px;
      z-index: 800;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      min-width: 0;
      width: 100%;
    }

    .brand-logo {
      display: block;
      width: 320px;
      height: 88px;
      flex: 0 1 320px;
      min-width: 0;
      object-fit: contain;
      object-position: center;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      transition: transform 160ms ease, filter 160ms ease;
      transform-origin: center;
      position: relative;
      z-index: 2;
    }

    .memory-map-logo {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      object-fit: cover;
      object-position: center 46%;
      border-radius: 8px;
    }

    .memory-map-link {
      display: block;
      width: 320px;
      height: 88px;
      flex: 0 1 320px;
      min-width: 0;
    }

    .brand-logo:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 10px 16px rgba(31, 41, 51, 0.14));
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.08;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .partner-logos {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      justify-items: center;
      gap: 10px;
      margin: 0;
      padding: 8px 14px;
      min-width: 0;
      width: 100%;
      height: 98px;
      background: #f9fafb;
      border: 1px solid rgba(31, 41, 51, 0.1);
      border-radius: 8px;
      overflow: visible;
    }

    .partner-logos a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-width: 0;
      text-decoration: none;
    }

    .partner-logos img {
      display: block;
      width: 100%;
      max-width: 172px;
      max-height: 60px;
      object-fit: contain;
      transition: transform 160ms ease, filter 160ms ease;
      transform-origin: center;
      position: relative;
      z-index: 1;
    }

    .partner-logos img:hover {
      transform: scale(1.14);
      filter: drop-shadow(0 10px 16px rgba(31, 41, 51, 0.18));
      z-index: 3;
    }

    .partner-logos .logo-foro {
      width: 80px;
      height: 80px;
      max-width: 80px;
      max-height: 80px;
    }

    .partner-logos .logo-uam {
      max-width: 222px;
      max-height: 64px;
    }

    .partner-logos .logo-ministerio {
      max-width: 188px;
      max-height: 82px;
    }

    .institutional-footer {
      grid-column: 1 / -1;
      grid-row: 3;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid rgba(31, 41, 51, 0.12);
    }

    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 34px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #fffaeb;
      color: var(--warn);
      border: 1px solid rgba(181, 71, 8, 0.24);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .connection-status.ok {
      background: #ecfdf3;
      color: var(--ok);
      border-color: rgba(8, 116, 67, 0.22);
    }

    .connection-status.bad {
      background: #fef3f2;
      color: var(--bad);
      border-color: rgba(180, 35, 24, 0.24);
    }

    .connection-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(181, 71, 8, 0.12);
    }

    .connection-status.ok .connection-dot {
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(8, 116, 67, 0.12);
    }

    .connection-status.bad .connection-dot {
      background: var(--bad);
      box-shadow: 0 0 0 4px rgba(180, 35, 24, 0.12);
    }

    .status {
      min-height: 34px;
      padding: 9px 11px;
      border-radius: 8px;
      background: #fffaeb;
      color: var(--warn);
      border: 1px solid rgba(181, 71, 8, 0.24);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .status.ok {
      background: #ecfdf3;
      color: var(--ok);
      border-color: rgba(8, 116, 67, 0.22);
    }

    .status.bad {
      background: #fef3f2;
      color: var(--bad);
      border-color: rgba(180, 35, 24, 0.24);
    }

    .panel {
      border: 1px solid rgba(31, 41, 51, 0.1);
      border-radius: 8px;
      background: var(--white);
      padding: 13px;
      margin-bottom: 12px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .stat {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      line-height: 1;
      margin-bottom: 2px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 10px;
    }

    label,
    .label {
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      color: var(--ink);
      padding: 9px 11px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(226, 24, 130, 0.13);
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 98px;
      gap: 8px;
      align-items: end;
    }

    .location-radius-row {
      display: grid;
      grid-template-columns: minmax(92px, 130px) 98px;
      gap: 8px;
      align-items: end;
    }

    .location-radius-row .field {
      margin-bottom: 0;
    }

    .button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--brand);
      color: var(--white);
      font-weight: 700;
    }

    .button:hover {
      background: var(--brand-dark);
    }

    .button.secondary {
      background: #eef2f7;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .button.secondary:hover {
      background: #e4e9f2;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .location-actions {
      margin-top: 10px;
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      font-weight: 700;
      font-size: 12px;
    }

    .chip.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

      .chip.repression.active {
        background: #db040b;
        border-color: #db040b;
      }

      .chip.resistance.active {
        background: #0152c4;
        border-color: #0152c4;
      }

    .suggestions {
      display: grid;
      gap: 6px;
      max-height: 180px;
      overflow: auto;
    }

    .suggestion {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 9px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
    }

    .legend-section {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .legend-title {
      font-size: 13px;
      font-weight: 800;
      border-bottom: 2px solid currentColor;
      padding-bottom: 4px;
    }

    .legend-grid {
      display: grid;
      gap: 8px;
    }

    .legend-item {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
    }

    .legend-item img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .subcategory-level {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .subcategory-grid {
      display: grid;
      gap: 8px;
    }

    .subcategory-option {
      width: 100%;
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      text-align: left;
    }

    .subcategory-option.active {
      background: var(--soft);
      color: var(--ink);
    }

    .subcategory-option.represion.active {
      border-color: var(--repression);
      box-shadow: inset 0 0 0 2px var(--repression);
    }

    .subcategory-option.resistencia.active {
      border-color: var(--resistance);
      box-shadow: inset 0 0 0 2px var(--resistance);
    }

    .map-wrap {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #eef2f7;
    }

    #map.picking-point {
      cursor: crosshair;
    }

    .map-topbar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 700;
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) minmax(0, max-content);
      align-items: start;
      gap: 10px;
      pointer-events: none;
    }

    .map-topbar .leaflet-control-zoom {
      float: none;
      margin: 0;
      pointer-events: auto;
    }

    .map-overlay-center {
      display: grid;
      gap: 9px;
      min-width: 0;
      pointer-events: none;
    }

    .map-filter-toolbar {
      display: flex;
      justify-content: center;
      align-items: start;
      flex-wrap: nowrap;
      gap: 8px;
      min-width: 0;
      pointer-events: auto;
    }

    .floating-filter {
      position: relative;
      flex: 0 1 150px;
      min-width: 120px;
    }

    .floating-filter.subcategory-filter {
      flex-basis: 185px;
      min-width: 150px;
    }

    .floating-filter.material-filter {
      flex-basis: 130px;
      min-width: 110px;
    }

    .floating-filter select,
    .floating-filter input {
      min-height: 42px;
      border-color: rgba(31, 41, 51, 0.18);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 24px rgba(31, 41, 51, 0.16);
    }

    .floating-filter select:disabled {
      color: var(--muted);
      background: rgba(245, 247, 251, 0.96);
    }

    .floating-filter select[data-filter-tone="represion"] {
      border-color: var(--repression);
    }

    .floating-filter select[data-filter-tone="resistencia"] {
      border-color: var(--resistance);
    }

    .floating-location {
      flex: 0 1 240px;
      width: 240px;
      max-width: 240px;
      min-width: 200px;
      z-index: 2;
    }

    .floating-location-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
    }

    .floating-location-search input {
      min-width: 0;
    }

    .floating-location .suggestions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: min(260px, 42vh);
      padding: 6px;
      border: 1px solid rgba(31, 41, 51, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 14px 30px rgba(31, 41, 51, 0.2);
    }

    .floating-location .suggestions:empty {
      display: none;
    }

    .floating-radius {
      flex: 0 0 76px;
      min-width: 76px;
    }

    .floating-radius::after {
      content: "km";
      position: absolute;
      top: 50%;
      right: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .floating-radius input {
      padding-right: 32px;
    }

    .floating-map-button {
      min-height: 42px;
      padding-inline: 10px;
      white-space: nowrap;
    }

    .floating-map-button.location-primary {
      background: var(--brand);
      color: var(--white);
      border-color: var(--brand);
    }

    .floating-map-button.location-primary:hover {
      background: var(--brand-dark);
    }

    .floating-location-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .map-pill-stack,
    .map-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
      pointer-events: auto;
    }

    .map-pill-stack {
      justify-content: center;
    }

    .map-actions {
      justify-content: flex-end;
    }

    .map-pill {
      max-width: 100%;
      overflow-wrap: anywhere;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(31, 41, 51, 0.12);
      border-radius: 999px;
      box-shadow: 0 12px 28px rgba(31, 41, 51, 0.14);
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .map-action-button {
      min-height: 38px;
      border: 1px solid rgba(31, 41, 51, 0.14);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      box-shadow: 0 12px 28px rgba(31, 41, 51, 0.14);
      font-size: 13px;
      font-weight: 800;
    }

    .map-action-button:hover,
    .map-action-button.active {
      background: var(--ink);
      color: var(--white);
    }

    .show-sidebar-button {
      display: none;
    }

    .map-app.sidebar-hidden .show-sidebar-button {
      display: inline-block;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1150;
      background: rgba(10, 14, 22, 0.56);
    }

    .drawer {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(920px, calc(100vw - 32px));
      height: min(80vh, 760px);
      height: min(80dvh, 760px);
      background: #fff;
      z-index: 1151;
      transform: translate(-50%, -50%);
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(10, 14, 22, 0.3);
      display: none;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .drawer.open {
      display: grid;
    }

    .drawer-head > div {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .drawer-head button {
      flex: none;
    }

    .content-grid-panel {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      max-height: min(58vh, 620px);
      z-index: 850;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(31, 41, 51, 0.12);
      border-radius: 8px;
      box-shadow: 0 18px 42px rgba(31, 41, 51, 0.18);
      overflow: hidden;
    }

    .content-grid-panel.fullscreen {
      position: fixed;
      inset: 0;
      max-height: none;
      z-index: 1100;
      border-radius: 0;
    }

    .content-grid-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .content-grid-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .content-grid-head .muted {
      font-size: 13px;
    }

    .content-grid-body {
      overflow: auto;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      align-content: start;
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .drawer-body {
      overflow: auto;
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .media-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .media-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .gallery-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .gallery-card h3 {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      height: 2.7em;
      line-height: 1.35;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .gallery-card .info-row {
      min-width: 0;
    }

    .gallery-card .info-row strong {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      height: 2.8em;
      line-height: 1.4;
      overflow: hidden;
    }

    .gallery-cover {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 8px;
      background: var(--soft);
      margin-bottom: 10px;
    }

    .gallery-cover.clickable {
      cursor: zoom-in;
    }

    .gallery-cover-empty {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .gallery-testimony {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      min-width: 0;
    }

    .gallery-testimony img {
      width: 34px;
      height: 34px;
      flex: none;
      object-fit: contain;
    }

    .gallery-testimony .info-row {
      margin-top: 0;
    }

    .gallery-shared {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      height: 2.8em;
      line-height: 1.4;
      margin: 8px 0 0;
      overflow: hidden;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
    }

    .gallery-actions {
      display: grid;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
    }

    .gallery-actions .resource-link {
      width: 100%;
      margin: 0;
    }

    .gallery-actions .gallery-more {
      width: 100%;
      margin: 0;
    }

    .media-preview {
      width: 100%;
      max-height: 260px;
      border-radius: 8px;
      background: var(--soft);
      object-fit: contain;
      margin-bottom: 10px;
    }

    .media-preview-fallback {
      display: grid;
      gap: 8px;
      align-content: center;
      min-height: 150px;

      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;

      cursor: zoom-in;
      transition: transform 150ms ease, box-shadow 150ms ease;

      transform: scale(1.01);

    .resource-link {

      border: 1px solid var(--line);

      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .info-row {
      display: grid;
      gap: 2px;
      margin-top: 8px;
    }

    .info-row span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .info-row strong {
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .leaflet-marker-icon.custom-marker {
      object-fit: contain;
      filter: drop-shadow(0 5px 8px rgba(31, 41, 51, 0.28));
    }

    .pin-marker {
      width: 24px;
      height: 24px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(31, 41, 51, 0.28);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: rgba(10, 14, 22, 0.86);
      padding: 18px;
    }

    .lightbox.hidden {
      display: none;
    }

    .lightbox-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #fff;
      margin-bottom: 12px;
    }

    .lightbox-head strong {
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .lightbox-body {
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .lightbox-body img,
    .lightbox-body video {
      max-width: min(100%, 1180px);
      max-height: calc(100vh - 96px);
      border-radius: 8px;
      background: #000;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);

    .hidden {

    @media (max-width: 1700px) and (min-width: 761px) {

      }

    @media (max-width: 760px) {
      .map-topbar {
        top: 10px;

        grid-template-columns: max-content minmax(0, 1fr);

      .map-overlay-center {

      }

      .map-actions {

      }

      .map-filter-toolbar {

      .floating-filter,

    @media (max-width: 640px) {

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE_URL = 'https://www.vocesterritorios.com/apimemoland';
    const ENDPOINTS = {
      photos: `${API_BASE_URL}/photo/getAllPhotos`,
      videos: `${API_BASE_URL}/video/getAllVideos`,
      texts: `${API_BASE_URL}/text/getAllTexts`,
      audios: `${API_BASE_URL}/audio/getAllAudios`
    };

    const MARKER_ICON_SIZE_OPTIONS = {
      'muy-pequeno': { folder: '40px', size: 40 },
      pequeno: { folder: '70px', size: 70 },
      mediano: { folder: '140px', size: 70 },
      grande: { folder: '220px', size: 92 },
      'muy-grande': { folder: '320px', size: 112 }
    };

    const REPRESSION_COLOR = '#4285f4';
    const RESISTANCE_COLOR = '#db4437';

    const EVENT_TYPES = [
      { label: 'Todos', value: '' },
      { label: 'Represion', value: 'Represion', className: 'repression' },
      { label: 'Resistencia', value: 'Resistencia', className: 'resistance' }
    ];

    const SUBCATEGORY_OPTIONS = {
      Represion: [
        { id: 'represion_detencion_juicio', label: 'Detencion y juicio' },
        { id: 'represion_condena', label: 'Condena' },
        { id: 'represion_muerte', label: 'Muerte' },
        { id: 'represion_fosa_comun', label: 'Fosa comun' },
        { id: 'represion_expropiacion', label: 'Expropiacion' }
      ],
      Resistencia: [
        { id: 'resistencia_movilizacion_social', label: 'Movilizacion social' },
        { id: 'resistencia_accion_politica', label: 'Accion politica' },
        { id: 'resistencia_accion_directa', label: 'Accion directa' },
        { id: 'resistencia_homenaje_reconocimiento', label: 'Homenaje o reconocimiento' },
        { id: 'resistencia_exhumacion', label: 'Exhumacion' }
      ]
    };

    const MEDIA_TYPES = {
      photo: { label: 'Foto', field: 'photos' },
      video: { label: 'Video', field: 'videos' },
      text: { label: 'Texto', field: 'texts' },
      audio: { label: 'Audio', field: 'audios' }
    };

    const MEDIA_TYPE_FILTERS = [
      { label: 'Todos', value: '' },
      { label: 'Fotos', value: 'photo' },
      { label: 'Videos', value: 'video' },
      { label: 'Textos', value: 'text' },
      { label: 'Audios', value: 'audio' }
    ];

    const state = {
      map: null,
      markerLayer: null,
      photos: [],
      videos: [],
      texts: [],
      audios: [],
      markers: [],
      userLocationLayer: null,
      activeEventType: '',
      activeMediaType: '',
      activeSubcategory: '',
      locationFilter: null,
      locationSuggestions: [],
      locationTimer: null,
      isPickingPoint: false,
      isSidebarHidden: true,
      isGridOpen: false,
      isGridFullscreen: false,
      iconSize: 'muy-pequeno'
    };

    const $ = (selector) => document.querySelector(selector);

    const elements = {
      status: $('#status'),
      connectionStatus: $('#connectionStatus'),
      eventFilters: $('#eventFilters'),
      mediaTypeFilters: $('#mediaTypeFilters'),
      subcategoryPanel: $('#subcategoryPanel'),
      subcategoryFilters: $('#subcategoryFilters'),
      locationQuery: $('#locationQuery'),
      locationRadius: $('#locationRadius'),
      locationSearchButton: $('#locationSearchButton'),
      locationSuggestions: $('#locationSuggestions'),
      clearLocationButton: $('#clearLocationButton'),
      clearAllFiltersButton: $('#clearAllFiltersButton'),
      locateButton: $('#locateButton'),
      pickPointButton: $('#pickPointButton'),
      mapElement: $('#map'),
      mapZoomSlot: $('#mapZoomSlot'),
      iconSize: $('#iconSize'),
      refreshButton: $('#refreshButton'),
      showAllButton: $('#showAllButton'),
      fitButton: $('#fitButton'),
      toggleSidebarButton: $('#toggleSidebarButton'),
      showSidebarButton: $('#showSidebarButton'),
      toggleGridButton: $('#toggleGridButton'),
      contentGridPanel: $('#contentGridPanel'),
      contentGridTitle: $('#contentGridTitle'),
      contentGridSubtitle: $('#contentGridSubtitle'),
      contentGridBody: $('#contentGridBody'),
      gridFullscreenButton: $('#gridFullscreenButton'),
      closeGridButton: $('#closeGridButton'),
      legend: $('#legend'),
      activeFilterLabel: $('#activeFilterLabel'),
      visibleCountLabel: $('#visibleCountLabel'),
      drawerBackdrop: $('#drawerBackdrop'),
      drawer: $('#contentDrawer'),
      drawerTitle: $('#drawerTitle'),
      drawerSubtitle: $('#drawerSubtitle'),
      drawerBody: $('#drawerBody'),
      closeDrawerButton: $('#closeDrawerButton'),
      lightbox: $('#lightbox'),
      lightboxTitle: $('#lightboxTitle'),
      lightboxBody: $('#lightboxBody'),
      closeLightboxButton: $('#closeLightboxButton'),
      statMarkers: $('#statMarkers'),
      statContents: $('#statContents'),
      statRepression: $('#statRepression'),
      statResistance: $('#statResistance')
    };

    function setStatus(message, type = '') {
      if (!message) {
        elements.status.textContent = '';
        elements.status.className = 'status hidden';
        return;
      }

      elements.status.textContent = message;
      elements.status.className = `status ${type}`.trim();
    }

    function setConnectionStatus(type, message) {
      elements.connectionStatus.className = `connection-status ${type}`.trim();
      elements.connectionStatus.title = message;
      elements.connectionStatus.setAttribute('aria-label', message);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function parseMaybeJson(value) {
      if (!value) return null;
      if (typeof value === 'object') return value;
      if (typeof value === 'string') {
        try {
          return JSON.parse(value);
        } catch (error) {
          return null;
        }
      }
      return null;
    }

    function parseListValue(value) {
      if (!value) return [];
      if (Array.isArray(value)) {
        return value.flatMap((item) => parseListValue(item));
      }
      if (typeof value === 'string') {
        try {
          const parsed = JSON.parse(value);
          if (Array.isArray(parsed)) return parsed.map(String).map((item) => item.trim()).filter(Boolean);
        } catch (error) {
          return value.split(',').map((item) => item.trim()).filter(Boolean);
        }
        return value.split(',').map((item) => item.trim()).filter(Boolean);
      }
      return [String(value)];
    }

    function normalizeText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .toLowerCase();
    }

    function formatListValue(value) {
      const values = parseListValue(value);
      return values.length ? values.join(', ') : '';
    }

    function getMediaForm(media) {
      return parseMaybeJson(media?.fichaDescriptiva) ||
        parseMaybeJson(media?.formData) ||
        parseMaybeJson(media?.form) ||
        media?.form ||
        {};
    }

    function getMediaEventTypes(media) {
      const form = getMediaForm(media);
      const candidates = [
        media?.fichaEventTypes,
        form.eventTypes,
        media?.eventTypes,
        media?.category,
        media?.accionObservada
      ];

      for (const value of candidates) {
        const parsed = parseListValue(value).filter(Boolean);
        if (parsed.length) return parsed;
      }

      return [];
    }

    function getMediaRepressionActions(media) {
      const form = getMediaForm(media);
      return parseListValue(media?.fichaRepressionActions || form.repressionActions || media?.repressionActions || media?.patrimonioMaterial);
    }

    function getMediaResistanceActions(media) {
      const form = getMediaForm(media);
      return parseListValue(media?.fichaResistanceActions || form.resistanceActions || media?.resistanceActions || media?.patrimonioInmaterial);
    }

    function getFirstNormalizedValue(values) {
      return normalizeText(parseListValue(values)[0]);
    }

    function getMarkerIconId(media) {
      const firstEventType = normalizeText(getMediaEventTypes(media)[0]);

      if (firstEventType === 'represion') {
        const firstAction = getFirstNormalizedValue(getMediaRepressionActions(media));
        const occurrencePlaces = parseListValue(
          media?.fichaOccurrencePlaces ||
          getMediaForm(media).occurrencePlaces ||
          media?.location
        ).map(normalizeText);

        if (occurrencePlaces.includes('fosa comun')) return 'represion_fosa_comun';
        if (firstAction.includes('detencion') || firstAction.includes('juicio')) return 'represion_detencion_juicio';
        if (
          firstAction.includes('muerte') ||
          firstAction.includes('fusilamiento') ||
          firstAction.includes('garrote') ||
          firstAction.includes('ejecucion') ||
          firstAction.includes('secuestro') ||
          firstAction.includes('desaparicion')
        ) return 'represion_muerte';
        if (firstAction.includes('expropiacion') || firstAction.includes('depuracion')) return 'represion_expropiacion';
        if (firstAction.includes('traslado') || firstAction.includes('cadaver')) return 'represion_fosa_comun';
        return 'represion_condena';
      }

      if (firstEventType === 'resistencia') {
        const firstAction = getFirstNormalizedValue(getMediaResistanceActions(media));

        if (firstAction.includes('protesta') || firstAction.includes('movilizacion')) return 'resistencia_movilizacion_social';
        if (firstAction.includes('organizacion politica')) return 'resistencia_accion_politica';
        if (firstAction.includes('sabotaje') || firstAction.includes('guerrilla') || firstAction.includes('maqui')) return 'resistencia_accion_directa';
        if (firstAction.includes('homenaje') || firstAction.includes('reconocimiento')) return 'resistencia_homenaje_reconocimiento';
        if (firstAction.includes('exhumacion')) return 'resistencia_exhumacion';
        return 'resistencia_accion_politica';
      }

      return null;
    }

    function getMediaCoordinate(media) {
      return {
        latitude: Number(media?.latitude),
        longitude: Number(media?.longitude)
      };
    }

    function getDistanceKm(firstCoordinate, secondCoordinate) {
      const firstLatitude = Number(firstCoordinate?.latitude);
      const firstLongitude = Number(firstCoordinate?.longitude);
      const secondLatitude = Number(secondCoordinate?.latitude);
      const secondLongitude = Number(secondCoordinate?.longitude);

      if (
        !Number.isFinite(firstLatitude) ||
        !Number.isFinite(firstLongitude) ||
        !Number.isFinite(secondLatitude) ||
        !Number.isFinite(secondLongitude)
      ) return Infinity;

      const earthRadiusKm = 6371;
      const latitudeDistance = ((secondLatitude - firstLatitude) * Math.PI) / 180;
      const longitudeDistance = ((secondLongitude - firstLongitude) * Math.PI) / 180;
      const firstLatitudeRadians = (firstLatitude * Math.PI) / 180;
      const secondLatitudeRadians = (secondLatitude * Math.PI) / 180;
      const a =
        Math.sin(latitudeDistance / 2) * Math.sin(latitudeDistance / 2) +
        Math.cos(firstLatitudeRadians) *
          Math.cos(secondLatitudeRadians) *
          Math.sin(longitudeDistance / 2) *
          Math.sin(longitudeDistance / 2);

      return earthRadiusKm * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function valuesAreSameCoordinate(first, second) {
      const a = Number(first);
      const b = Number(second);
      return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) < 0.000001;
    }

    function normalizeCollection(data, key) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data?.[key])) return data[key];
      if (Array.isArray(data?.data)) return data.data;
      if (Array.isArray(data?.result)) return data.result;
      return [];
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || data.message || `Error HTTP ${response.status}`);
      return data;
    }

    function getAllContents() {
      return [
        ...state.photos.map((item) => ({ ...item, __mediaType: 'photo' })),
        ...state.videos.map((item) => ({ ...item, __mediaType: 'video' })),
        ...state.texts.map((item) => ({ ...item, __mediaType: 'text' })),
        ...state.audios.map((item) => ({ ...item, __mediaType: 'audio' }))
      ];
    }

    function mediaMatchesEventFilter(media) {
      if (!state.activeEventType) return true;
      return getMediaEventTypes(media).some((eventType) => normalizeText(eventType) === normalizeText(state.activeEventType));
    }

    function mediaMatchesTypeFilter(media) {
      if (!state.activeMediaType) return true;
      return media.__mediaType === state.activeMediaType;
    }

    function mediaMatchesSubcategory(media) {
      if (!state.activeSubcategory) return true;
      return getMarkerIconId(media) === state.activeSubcategory;
    }

    function mediaMatchesLocationFilter(media) {
      if (!state.locationFilter) return true;
      return getDistanceKm(getMediaCoordinate(media), state.locationFilter.coordinate) <= state.locationFilter.radiusKm;
    }

    function getVisibleContents() {
      return getAllContents().filter((item) =>
        mediaMatchesEventFilter(item) &&
        mediaMatchesTypeFilter(item) &&
        mediaMatchesSubcategory(item) &&
        mediaMatchesLocationFilter(item)
      );
    }

    function createMarkers(contents) {
      const markersByCoordinate = new Map();

      contents.forEach((media, index) => {
        const latitude = Number(media.latitude);
        const longitude = Number(media.longitude);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude) ||
          Math.abs(latitude) > 90 ||
          Math.abs(longitude) > 180
        ) return;

        const key = `${latitude.toFixed(6)},${longitude.toFixed(6)}`;
        if (!markersByCoordinate.has(key)) {
          markersByCoordinate.set(key, {
            id: `${key}-${index}`,
            latitude,
            longitude,
            media,
            contents: []
          });
        }

        markersByCoordinate.get(key).contents.push(media);
      });

      state.markers = Array.from(markersByCoordinate.values());
    }

    function getMarkerColor(media) {
      const firstEventType = normalizeText(getMediaEventTypes(media)[0]);
      if (firstEventType === 'represion') return REPRESSION_COLOR;
      if (firstEventType === 'resistencia') return RESISTANCE_COLOR;
      return '#e21882';
    }

    function getIconUrl(iconId) {
      if (!iconId) return '';
      const option = MARKER_ICON_SIZE_OPTIONS[state.iconSize] || MARKER_ICON_SIZE_OPTIONS.mediano;
      const fileName = iconId === 'represion_expropiacion' ? 'represion_exprociacion' : iconId;
      return `assets/map-icons/${option.folder}/${fileName}.png`;
    }

    function createLeafletIcon(marker) {
      const iconId = getMarkerIconId(marker.media);
      const sizeOption = MARKER_ICON_SIZE_OPTIONS[state.iconSize] || MARKER_ICON_SIZE_OPTIONS.mediano;

      if (iconId) {
        return L.icon({
          iconUrl: getIconUrl(iconId),
          iconSize: [sizeOption.size, sizeOption.size],
          iconAnchor: [sizeOption.size / 2, sizeOption.size],
          popupAnchor: [0, -sizeOption.size],
          className: 'custom-marker'
        });
      }

      const color = getMarkerColor(marker.media);
      return L.divIcon({
        html: `<div class="pin-marker" style="background:${color}"></div>`,
        className: '',
        iconSize: [28, 28],
        iconAnchor: [14, 28]
      });
    }

    function renderMarkers() {
      if (!state.map) return;
      const visibleContents = getVisibleContents();
      createMarkers(visibleContents);
      state.markerLayer.clearLayers();

      state.markers.forEach((marker) => {
        const leafletMarker = L.marker([marker.latitude, marker.longitude], {
          icon: createLeafletIcon(marker),
          title: 'Punto MEMOLAND'
        });

        leafletMarker.on('click', () => {
          if (state.isPickingPoint) return;
          openContentDrawer(marker.contents, 'Contenido del punto', `${marker.contents.length} elemento(s) en esta ubicacion`);
        });
        leafletMarker.addTo(state.markerLayer);
      });

      renderStats(visibleContents);
      renderActiveFilterLabel(visibleContents);
    }

    function fitVisibleMarkers() {
      if (!state.markers.length || !state.map) return;
      const bounds = L.latLngBounds(state.markers.map((marker) => [marker.latitude, marker.longitude]));
      state.map.fitBounds(bounds, { padding: [42, 42], maxZoom: 14 });
    }

    function renderStats(visibleContents = getVisibleContents()) {
      const repressionCount = visibleContents.filter((item) => getMediaEventTypes(item).some((type) => normalizeText(type) === 'represion')).length;
      const resistanceCount = visibleContents.filter((item) => getMediaEventTypes(item).some((type) => normalizeText(type) === 'resistencia')).length;

      elements.statMarkers.textContent = state.markers.length;
      elements.statContents.textContent = visibleContents.length;
      elements.statRepression.textContent = repressionCount;
      elements.statResistance.textContent = resistanceCount;
      elements.visibleCountLabel.textContent = `${visibleContents.length} contenido(s)`;
    }

    function renderActiveFilterLabel(visibleContents = getVisibleContents()) {
      const parts = [
        state.activeEventType || 'Todos los contenidos',
        state.activeMediaType ? MEDIA_TYPES[state.activeMediaType]?.label : '',
        state.activeSubcategory ? getSubcategoryLabel(state.activeSubcategory) : '',
        state.locationFilter ? state.locationFilter.label : ''
      ].filter(Boolean);
      elements.activeFilterLabel.textContent = parts.join(' / ');
      elements.visibleCountLabel.textContent = `${visibleContents.length} contenido(s)`;
    }

    function getSubcategoryLabel(id) {
      return Object.values(SUBCATEGORY_OPTIONS).flat().find((item) => item.id === id)?.label || id;
    }

    function renderEventFilters() {
      elements.eventFilters.innerHTML = EVENT_TYPES.map((option) => `
        <option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>
      `).join('');
      elements.eventFilters.value = state.activeEventType;
      elements.eventFilters.dataset.filterTone = normalizeText(state.activeEventType);
    }

    function renderMediaTypeFilters() {
      elements.mediaTypeFilters.innerHTML = MEDIA_TYPE_FILTERS.map((option) => `
        <option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>
      `).join('');
      elements.mediaTypeFilters.value = state.activeMediaType;
    }

    function renderSubcategoryFilters() {
      const options = SUBCATEGORY_OPTIONS[state.activeEventType] || [];
      elements.subcategoryFilters.disabled = !options.length;
      elements.subcategoryFilters.innerHTML = `
        <option value="">${options.length ? 'Todas las subcategorías' : 'Subcategoría'}</option>
        ${options.map((option) => `<option value="${escapeHtml(option.id)}">${escapeHtml(option.label)}</option>`).join('')}
      `;
      elements.subcategoryFilters.value = state.activeSubcategory;
    }

    function renderFilters() {
      renderEventFilters();
      renderMediaTypeFilters();
      renderSubcategoryFilters();
      renderMarkers();
      if (state.isGridOpen) renderContentGrid();
    }

    function renderLegend() {
      elements.legend.innerHTML = [
        { title: 'RESISTENCIA', color: RESISTANCE_COLOR, items: SUBCATEGORY_OPTIONS.Resistencia },
        { title: 'REPRESION', color: REPRESSION_COLOR, items: SUBCATEGORY_OPTIONS.Represion }
      ].map((section) => `
        <div class="legend-section">
          <div class="legend-title" style="color:${section.color}">${section.title}</div>
          <div class="legend-grid">
            ${section.items.map((item) => `
              <div class="legend-item">
                <img src="${escapeHtml(getIconUrl(item.id))}" alt="">
                <span>${escapeHtml(item.label.toUpperCase())}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function getMediaTitle(item) {
      return item.title || item.name || item.description || item.textContent || `${MEDIA_TYPES[item.__mediaType]?.label || 'Contenido'} Memoland`;
    }

    function getMediaUrl(item) {
      return item.secure_url || item.url || item.file || item.image || item.video || item.audio || '';
    }

    function isHeicUrl(url) {
      return /\.hei(c|f)(\?|#|$)/i.test(String(url || ''));
    }

    function getDisplayImageUrl(url) {
      const value = String(url || '');
      if (!isHeicUrl(value)) return value;
      if (value.includes('res.cloudinary.com') && value.includes('/image/upload/')) {
        return value.replace('/image/upload/', '/image/upload/f_auto,q_auto/');
      }
      return '';
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleDateString('es-ES');
    }

    function getMemolandFields(item) {
      const form = getMediaForm(item);
      return [
        ['Descripcion del evento', item.fichaDescription || form.description || item.description],
        ['Tipo de evento', formatListValue(item.fichaEventTypes || form.eventTypes || item.category || item.accionObservada)],
        ['Donde ocurre', formatListValue(item.fichaOccurrencePlaces || form.occurrencePlaces || item.location || item.ubicacion)],
        ['Otro lugar', item.fichaOccurrencePlaceOther || form.occurrencePlaceOther || item.newCategory],
        ['Periodo', item.fichaPeriod || form.period || item.lengua2],
        ['Fuente', item.fichaSource || form.source || item.reason || item.lengua1],
        ['Tiene homenaje o reconocimiento', item.fichaHasRecognition || form.hasRecognition || item.ambitoCultural],
        ['Reconocimiento por quien', formatListValue(item.fichaRecognitionActors || form.recognitionActors)],
        ['Forma de reconocimiento', formatListValue(item.fichaRecognitionForms || form.recognitionForms || item.ambitoCulturalOtro)],
        ['Acciones de represion', formatListValue(item.fichaRepressionActions || form.repressionActions || item.patrimonioMaterial)],
        ['Otra accion de represion', item.fichaRepressionActionOther || form.repressionActionOther || item.patrimonioMaterialOtro],
        ['Colectivo represaliado', formatListValue(item.fichaRepressedGroups || form.repressedGroups || item.importanciaComunidad)],
        ['Argumentos de represion', formatListValue(item.fichaRepressionArguments || form.repressionArguments)],
        ['Perpetradores', formatListValue(item.fichaPerpetrators || form.perpetrators)],
        ['Acciones de resistencia', formatListValue(item.fichaResistanceActions || form.resistanceActions || item.patrimonioInmaterial)],
        ['Otra accion de resistencia', item.fichaResistanceActionOther || form.resistanceActionOther || item.patrimonioInmaterialOtro],
        ['Contenido de la demanda', formatListValue(item.fichaDemandContents || form.demandContents || item.contribuyeDiversidad)],
        ['Tipo de organizador', formatListValue(item.fichaOrganizerTypes || form.organizerTypes || item.relacionCulturas)],
        ['Numero de participantes', item.fichaParticipantCount || form.participantCount],
        ['Participantes', item.fichaParticipantNames || form.participantNames]
      ].filter(([, value]) => value !== null && value !== undefined && String(value).trim() !== '');
    }

    function renderMediaPreview(item) {
      const url = getMediaUrl(item);
      const title = getMediaTitle(item);
      if (item.__mediaType === 'photo' && url) {
        const displayUrl = getDisplayImageUrl(url);
        if (!displayUrl) {
          return `
            <div class="media-preview-fallback">
              <span>Esta foto esta en formato HEIC y el navegador puede no visualizarla directamente.</span>
            </div>
            <a class="resource-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">Abrir recurso</a>
          `;
        }

        return `
          <img class="media-preview clickable" src="${escapeHtml(displayUrl)}" alt="" data-open-resource="image" data-resource-url="${escapeHtml(displayUrl)}" data-resource-title="${escapeHtml(title)}">
          <a class="resource-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">Abrir recurso</a>
        `;
      }
      if (item.__mediaType === 'video' && url) {
        return `
          <video class="media-preview clickable" src="${escapeHtml(url)}" controls data-open-resource="video" data-resource-url="${escapeHtml(url)}" data-resource-title="${escapeHtml(title)}"></video>
          <a class="resource-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">Abrir recurso</a>
        `;
      }
      if (item.__mediaType === 'audio' && url) {
        return `
          <audio class="media-preview" src="${escapeHtml(url)}" controls></audio>
          <a class="resource-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">Abrir recurso</a>
        `;
      }
      if (item.__mediaType === 'text') {
        const text = item.textContent || item.description || 'Texto sin contenido disponible';
        const secureUrl = item.secure_url || '';
        return `
          <div class="media-preview" style="padding:12px;max-height:none">${escapeHtml(text)}</div>
          ${secureUrl ? `<a class="resource-link" style="overflow-wrap:anywhere;word-break:break-word" href="${escapeHtml(secureUrl)}" target="_blank" rel="noopener">URL: ${escapeHtml(secureUrl)}</a>` : '<span class="resource-link">URL: -</span>'}
        `;
      }
      return '';
    }

    function openLightbox(type, url, title) {
      if (!url) return;
      elements.lightboxTitle.textContent = title || 'Recurso';

      if (type === 'video') {
        elements.lightboxBody.innerHTML = `<video src="${escapeHtml(url)}" controls autoplay></video>`;
      } else if (type === 'audio') {
        elements.lightboxBody.innerHTML = `<audio src="${escapeHtml(url)}" controls autoplay></audio>`;
      } else {
        elements.lightboxBody.innerHTML = `<img src="${escapeHtml(url)}" alt="">`;
      }

      elements.lightbox.classList.remove('hidden');
    }

    function closeLightbox() {
      elements.lightbox.classList.add('hidden');
      elements.lightboxBody.innerHTML = '';
    }

    function renderInfoRow(label, value) {
      if (value === null || value === undefined || String(value).trim() === '') return '';
      return `<div class="info-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function renderMediaCard(item, index) {
      const typeInfo = MEDIA_TYPES[item.__mediaType] || { label: 'Contenido' };
      const fields = getMemolandFields(item);
      return `
        <article class="media-card">
          <h3>${escapeHtml(typeInfo.label)} ${index + 1}</h3>
          ${renderMediaPreview(item)}
          ${renderInfoRow('Titulo', getMediaTitle(item))}
          ${renderInfoRow('Usuario', item.username)}
          ${renderInfoRow('Proyecto', item.projectName)}
          ${renderInfoRow('Fecha de subida', formatDate(item.date || item.createdAt || item.updatedAt))}
          ${renderInfoRow('Ubicacion', item.location || [item.city, item.country].filter(Boolean).join(', '))}
          ${renderInfoRow('Coordenadas', `${Number(item.latitude).toFixed(5)}, ${Number(item.longitude).toFixed(5)}`)}
          ${fields.length ? '<div class="info-row"><span>Ficha MEMOLAND</span></div>' : ''}
          ${fields.map(([label, value]) => renderInfoRow(label, value)).join('')}
        </article>
      `;
    }

    function getGalleryImageUrl(item) {
      const sources = item.__mediaType === 'photo'
        ? [getMediaUrl(item), item.coverImage, item.thumbnailUrl, item.thumbnail, item.poster]
        : [item.coverImage, item.thumbnailUrl, item.thumbnail, item.poster, item.image];
      return sources
        .map((value) => typeof value === 'string' ? value : value?.secure_url || value?.url)
        .map(getDisplayImageUrl)
        .find(Boolean) || '';
    }

    function renderGalleryCard(item) {
      const title = getMediaTitle(item);
      const contentId = String(item._id || item.id || '');
      const imageUrl = getGalleryImageUrl(item);
      const form = getMediaForm(item);
      const place = form.place || {};
      const city = item.fichaPlaceCity || place.city || item.city;
      const country = item.fichaPlaceCountry || place.country || item.country;
      const location = [city, country].filter(Boolean).join(', ') || item.location || item.ubicacion;
      const date = formatDate(item.date || item.createdAt || item.updatedAt) || item.fichaPeriod || form.period;
      const iconId = getMarkerIconId(item);
      const testimonyType = [formatListValue(getMediaEventTypes(item)), iconId ? getSubcategoryLabel(iconId) : ''].filter(Boolean).join(' / ');
      const materialType = MEDIA_TYPES[item.__mediaType]?.label;
      const username = item.username || item.user?.username || '';
      const resourceUrl = item.__mediaType === 'text' ? item.secure_url || '' : getMediaUrl(item);

      return `
        <article class="media-card gallery-card">
          ${imageUrl ? `
            <img class="gallery-cover ${item.__mediaType === 'photo' ? 'clickable' : ''}" src="${escapeHtml(imageUrl)}" alt="Foto principal de ${escapeHtml(title)}" loading="lazy"
              ${item.__mediaType === 'photo' ? `data-open-resource="image" data-resource-url="${escapeHtml(imageUrl)}" data-resource-title="${escapeHtml(title)}"` : ''}>
          ` : '<div class="gallery-cover gallery-cover-empty">Sin imagen disponible</div>'}
          <h3>${escapeHtml(title)}</h3>
          ${renderInfoRow('Lugar', location)}
          ${renderInfoRow('Fecha', date)}
          ${testimonyType ? `
            <div class="gallery-testimony">
              ${iconId ? `<img src="${escapeHtml(getIconUrl(iconId))}" alt="">` : ''}
              ${renderInfoRow('Tipo de testimonio', testimonyType)}
            </div>
          ` : ''}
          ${renderInfoRow('Tipo de material', materialType)}
          ${username ? `<p class="gallery-shared">Compartido por: <strong>${escapeHtml(username)}</strong></p>` : ''}
          <div class="gallery-actions">
            ${resourceUrl ? `<a class="resource-link" href="${escapeHtml(resourceUrl)}" target="_blank" rel="noopener">Abrir recurso</a>` : ''}
            <button class="button gallery-more" type="button" data-open-testimony data-content-id="${escapeHtml(contentId)}" data-content-type="${escapeHtml(item.__mediaType)}" ${contentId ? '' : 'disabled'}>SABER MÁS</button>
          </div>
        </article>
      `;
    }

    let drawerPreviousFocus = null;

    function openContentDrawer(contents, title, subtitle) {
      if (!elements.drawer.classList.contains('open')) drawerPreviousFocus = document.activeElement;
      elements.drawerTitle.textContent = title;
      elements.drawerSubtitle.textContent = subtitle;

      if (!contents.length) {
        elements.drawerBody.innerHTML = '<div class="media-card">No hay contenidos para los filtros seleccionados.</div>';
      } else {
        elements.drawerBody.innerHTML = contents.map(renderMediaCard).join('');
      }

      elements.drawerBackdrop.classList.remove('hidden');
      elements.drawer.classList.add('open');
      elements.drawer.setAttribute('aria-hidden', 'false');
      elements.drawerBody.scrollTop = 0;
      document.body.classList.add('dialog-open');
      elements.closeDrawerButton.focus();
    }

    function closeContentDrawer() {
      elements.drawer.classList.remove('open');
      elements.drawer.setAttribute('aria-hidden', 'true');
      elements.drawerBackdrop.classList.add('hidden');
      document.body.classList.remove('dialog-open');
      drawerPreviousFocus?.focus();
      drawerPreviousFocus = null;
    }

    function renderContentGrid() {
      const visibleContents = getVisibleContents();
      elements.contentGridTitle.textContent = 'Contenidos visibles';
      elements.contentGridSubtitle.textContent = `${visibleContents.length} contenido(s) segun los filtros actuales`;

      if (!visibleContents.length) {
        elements.contentGridBody.innerHTML = '<div class="media-card">No hay contenidos para los filtros seleccionados.</div>';
        return;
      }

      elements.contentGridBody.innerHTML = visibleContents.map(renderGalleryCard).join('');
    }

    function setGridFullscreen(isFullscreen) {
      state.isGridFullscreen = isFullscreen;
      elements.contentGridPanel.classList.toggle('fullscreen', isFullscreen);
      elements.gridFullscreenButton.textContent = isFullscreen ? 'Vista normal' : 'Pantalla completa';
    }

    function setGridOpen(isOpen) {
      state.isGridOpen = isOpen;
      elements.contentGridPanel.classList.toggle('hidden', !isOpen);
      elements.toggleGridButton.classList.toggle('active', isOpen);
      elements.toggleGridButton.textContent = isOpen ? 'Ocultar galería de testimonios' : 'Galería de testimonios';

      if (isOpen) {
        renderContentGrid();
      } else {
        setGridFullscreen(false);
      }
    }

    function toggleSidebar() {
      state.isSidebarHidden = !state.isSidebarHidden;
      document.querySelector('.map-app').classList.toggle('sidebar-hidden', state.isSidebarHidden);
      elements.toggleSidebarButton.classList.toggle('active', state.isSidebarHidden);
      setTimeout(() => state.map?.invalidateSize(), 180);
    }

    async function searchLocationCandidates(query) {
      const url = new URL('https://photon.komoot.io/api/');
      url.searchParams.set('q', query);
      url.searchParams.set('limit', '6');
      const response = await fetch(url.toString());
      const data = await response.json();
      const features = Array.isArray(data?.features) ? data.features : [];

      return features.map((feature, index) => {
        const [longitude, latitude] = feature.geometry?.coordinates || [];
        const properties = feature.properties || {};
        const displayParts = [
          properties.name,
          properties.street && properties.street !== properties.name ? properties.street : null,
          properties.postcode,
          properties.city || properties.locality || properties.district,
          properties.county,
          properties.state,
          properties.country
        ].filter(Boolean);

        return {
          place_id: properties.osm_id || `${query}-${index}`,
          lat: latitude,
          lon: longitude,
          display_name: displayParts.length ? displayParts.join(', ') : query
        };
      }).filter((suggestion) =>
        Number.isFinite(Number(suggestion.lat)) &&
        Number.isFinite(Number(suggestion.lon))
      );
    }

    function renderLocationSuggestions() {
      elements.locationSuggestions.innerHTML = state.locationSuggestions.map((suggestion, index) => `
        <button class="suggestion" type="button" data-location-index="${index}">
          ${escapeHtml(suggestion.display_name)}
        </button>
      `).join('');
    }

    function renderPickingPointState() {
      elements.pickPointButton.classList.toggle('active', state.isPickingPoint);
      elements.pickPointButton.textContent = state.isPickingPoint ? 'Haz clic en el mapa' : 'Elegir punto';
      elements.mapElement.classList.toggle('picking-point', state.isPickingPoint);
    }

    function setPickingPointMode(isActive) {
      state.isPickingPoint = isActive;
      renderPickingPointState();
      if (isActive) {
        setStatus('Haz clic en el mapa para filtrar contenidos dentro del radio indicado.', 'ok');
      }
    }

    async function updateLocationSuggestions() {
      const query = elements.locationQuery.value.trim();
      if (query.length < 3) {
        state.locationSuggestions = [];
        renderLocationSuggestions();
        return;
      }

      try {
        state.locationSuggestions = await searchLocationCandidates(query);
        renderLocationSuggestions();
      } catch (error) {
        state.locationSuggestions = [];
        renderLocationSuggestions();
      }
    }

    async function applyLocationFilter(selectedSuggestion = null) {
      const query = String(selectedSuggestion?.display_name || elements.locationQuery.value).trim();
      const radiusKm = Number(String(elements.locationRadius.value).replace(',', '.'));

      if (!query) {
        setStatus('Escribe una ubicacion para buscar.', 'bad');
        return;
      }

      if (!Number.isFinite(radiusKm) || radiusKm <= 0) {
        setStatus('Indica un radio valido en kilometros.', 'bad');
        return;
      }

      setStatus('Buscando ubicacion...');
      setPickingPointMode(false);
      elements.locationSearchButton.disabled = true;

      try {
        const candidates = selectedSuggestion ? [selectedSuggestion] : await searchLocationCandidates(query);
        const candidate = candidates[0];

        if (!candidate) {
          setStatus('No se encontro esa ubicacion. Prueba con una busqueda mas especifica.', 'bad');
          return;
        }

        state.locationFilter = {
          label: candidate.display_name || query,
          coordinate: {
            latitude: Number(candidate.lat),
            longitude: Number(candidate.lon)
          },
          radiusKm
        };
        state.activeEventType = '';
        state.activeSubcategory = '';
        elements.locationQuery.value = state.locationFilter.label;
        state.map.setView([state.locationFilter.coordinate.latitude, state.locationFilter.coordinate.longitude], 12);
        renderFilters();
        openContentDrawer(getVisibleContents(), `Contenidos en ${state.locationFilter.label}`, `${getVisibleContents().length} contenido(s) encontrados`);
        setStatus(`Filtro activo: ${state.locationFilter.label} (${radiusKm} km)`, 'ok');
      } catch (error) {
        setStatus(error.message || 'No se pudo buscar la ubicacion.', 'bad');
      } finally {
        elements.locationSearchButton.disabled = false;
      }
    }

    function clearLocationFilter() {
      state.locationFilter = null;
      state.locationSuggestions = [];
      elements.locationQuery.value = '';
      setPickingPointMode(false);
      if (state.userLocationLayer) {
        state.userLocationLayer.remove();
        state.userLocationLayer = null;
      }
      renderLocationSuggestions();
      renderFilters();
      setStatus('Filtro de ubicacion eliminado.', 'ok');
    }

    function clearAllFilters() {
      state.activeEventType = '';
      state.activeMediaType = '';
      state.activeSubcategory = '';
      state.locationFilter = null;
      state.locationSuggestions = [];
      elements.locationQuery.value = '';
      elements.locationRadius.value = '20';
      setPickingPointMode(false);

      if (state.userLocationLayer) {
        state.userLocationLayer.remove();
        state.userLocationLayer = null;
      }

      renderLocationSuggestions();
      renderFilters();
      fitVisibleMarkers();
      setStatus('Todos los filtros han sido eliminados.', 'ok');
    }

    function getCurrentRadiusKm() {
      const radiusKm = Number(String(elements.locationRadius.value).replace(',', '.'));
      return Number.isFinite(radiusKm) && radiusKm > 0 ? radiusKm : 20;
    }

    function applyLocationCenter(latitude, longitude, label, radiusKm, zoom = 14) {
      state.locationFilter = {
        label,
        coordinate: {
          latitude,
          longitude
        },
        radiusKm
      };
      elements.locationQuery.value = label;

      if (state.userLocationLayer) {
        state.userLocationLayer.remove();
      }

      state.userLocationLayer = L.layerGroup([
        L.circle([latitude, longitude], {
          radius: radiusKm * 1000,
          color: '#e21882',
          weight: 2,
          fillColor: '#e21882',
          fillOpacity: 0.08
        }),
        L.circleMarker([latitude, longitude], {
          radius: 7,
          color: '#ffffff',
          weight: 2,
          fillColor: '#e21882',
          fillOpacity: 1
        })
      ]).addTo(state.map);

      state.map.flyTo([latitude, longitude], zoom, {
        animate: true,
        duration: 0.85
      });
      renderFilters();
    }

    function getLocationErrorMessage(error) {
      if (!error) return 'No se pudo obtener tu ubicacion precisa.';
      if (error.code === 1) return 'Permiso de ubicacion denegado por el navegador.';
      if (error.code === 2) return 'El navegador no pudo determinar tu ubicacion precisa.';
      if (error.code === 3) return 'La solicitud de ubicacion tardo demasiado.';
      return 'No se pudo obtener tu ubicacion precisa.';
    }

    async function fetchIpLocation() {
      const services = [
        {
          url: 'https://ipapi.co/json/',
          normalize: (data) => ({
            latitude: Number(data.latitude),
            longitude: Number(data.longitude),
            label: [data.city, data.country_name].filter(Boolean).join(', ')
          })
        },
        {
          url: 'https://ipwho.is/',
          normalize: (data) => ({
            latitude: Number(data.latitude),
            longitude: Number(data.longitude),
            label: [data.city, data.country].filter(Boolean).join(', ')
          })
        }
      ];

      for (const service of services) {
        try {
          const data = await fetchJson(service.url);
          const location = service.normalize(data);
          if (Number.isFinite(location.latitude) && Number.isFinite(location.longitude)) {
            return location;
          }
        } catch (error) {
          console.warn('No se pudo obtener ubicacion aproximada', service.url, error);
        }
      }

      return null;
    }

    async function locateByIpFallback(reasonMessage) {
      const radiusKm = getCurrentRadiusKm();
      setStatus(`${reasonMessage} Buscando ubicacion aproximada por IP...`);

      try {
        const location = await fetchIpLocation();
        if (!location) {
          setStatus(`${reasonMessage} Tambien fallo la ubicacion aproximada. Usa el buscador de ciudad o pais.`, 'bad');
          return;
        }

        const label = location.label ? `Ubicacion aproximada: ${location.label}` : 'Ubicacion aproximada';
        applyLocationCenter(location.latitude, location.longitude, label, radiusKm, 10);
        setStatus(`No se pudo usar la ubicacion precisa. Se aplico ubicacion aproximada por IP (${radiusKm} km).`, 'ok');
      } finally {
        elements.locateButton.disabled = false;
      }
    }

    function locateUser() {
      setPickingPointMode(false);
      elements.locateButton.disabled = true;

      if (!navigator.geolocation) {
        locateByIpFallback('Tu navegador no permite obtener ubicacion precisa.');
        return;
      }

      setStatus('Solicitando ubicacion del navegador...');
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const radiusKm = getCurrentRadiusKm();
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          applyLocationCenter(latitude, longitude, 'Mi ubicacion', radiusKm, 14);
          setStatus(`Filtro activo: mi ubicacion (${radiusKm} km)`, 'ok');
          elements.locateButton.disabled = false;
        },
        (error) => locateByIpFallback(getLocationErrorMessage(error)),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
      );
    }

    function applyMapPointFilter(latlng) {
      const latitude = Number(latlng?.lat);
      const longitude = Number(latlng?.lng);

      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
        setStatus('No se pudo leer el punto seleccionado en el mapa.', 'bad');
        return;
      }

      const radiusKm = getCurrentRadiusKm();
      const label = `Punto elegido (${latitude.toFixed(5)}, ${longitude.toFixed(5)})`;
      setPickingPointMode(false);
      applyLocationCenter(latitude, longitude, label, radiusKm, 13);
      const visibleContents = getVisibleContents();
      openContentDrawer(visibleContents, 'Contenidos cercanos al punto', `${visibleContents.length} contenido(s) a ${radiusKm} km`);
      setStatus(`Filtro activo: punto elegido en el mapa (${radiusKm} km)`, 'ok');
    }

    function handleMapClick(event) {
      if (!state.isPickingPoint) return;
      applyMapPointFilter(event.latlng);
    }

    async function loadData(shouldFitMarkers = true) {
      setConnectionStatus('', 'Comprobando conexion con Memoland');
      setStatus('Cargando contenidos desde Memoland...');
      elements.refreshButton.disabled = true;

      try {
        const [photos, videos, texts, audios] = await Promise.all([
          fetchJson(ENDPOINTS.photos),
          fetchJson(ENDPOINTS.videos),
          fetchJson(ENDPOINTS.texts),
          fetchJson(ENDPOINTS.audios)
        ]);

        state.photos = normalizeCollection(photos, 'photos');
        state.videos = normalizeCollection(videos, 'videos');
        state.texts = normalizeCollection(texts, 'texts');
        state.audios = normalizeCollection(audios, 'audios');

        renderFilters();
        if (shouldFitMarkers) fitVisibleMarkers();
        setConnectionStatus('ok', 'Conectado a Memoland');
        setStatus('');
      } catch (error) {
        setConnectionStatus('bad', 'No se pudo conectar con Memoland');
        setStatus(error.message || 'No se pudieron cargar los contenidos.', 'bad');
        renderFilters();
      } finally {
        elements.refreshButton.disabled = false;
      }
    }

    function initMap() {
      state.map = L.map('map', {
        zoomControl: true
      }).setView([40.54, -3.765], 9);
      elements.mapZoomSlot.classList.toggle('leaflet-touch', elements.mapElement.classList.contains('leaflet-touch'));
      elements.mapZoomSlot.appendChild(state.map.zoomControl.getContainer());

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(state.map);

      state.markerLayer = L.layerGroup().addTo(state.map);
      state.map.on('click', handleMapClick);
      setTimeout(() => state.map.invalidateSize(), 150);
    }

    elements.eventFilters.addEventListener('change', () => {
      state.activeEventType = elements.eventFilters.value;
      state.activeSubcategory = '';
      renderFilters();
      fitVisibleMarkers();
    });

    elements.mediaTypeFilters.addEventListener('change', () => {
      state.activeMediaType = elements.mediaTypeFilters.value;
      renderFilters();
      fitVisibleMarkers();
    });

    elements.subcategoryFilters.addEventListener('change', () => {
      state.activeSubcategory = elements.subcategoryFilters.value;
      renderFilters();
      fitVisibleMarkers();
    });

    elements.locationSearchButton.addEventListener('click', () => applyLocationFilter());
    elements.locationQuery.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        applyLocationFilter();
      }
    });
    elements.locationQuery.addEventListener('input', () => {
      window.clearTimeout(state.locationTimer);
      state.locationTimer = window.setTimeout(updateLocationSuggestions, 500);
    });
    elements.locationSuggestions.addEventListener('click', (event) => {
      const button = event.target.closest('[data-location-index]');
      if (!button) return;
      applyLocationFilter(state.locationSuggestions[Number(button.dataset.locationIndex)]);
    });
    elements.clearLocationButton.addEventListener('click', clearLocationFilter);
    elements.clearAllFiltersButton.addEventListener('click', clearAllFilters);
    elements.locateButton.addEventListener('click', locateUser);
    elements.pickPointButton.addEventListener('click', () => setPickingPointMode(!state.isPickingPoint));
    elements.iconSize.addEventListener('change', () => {
      state.iconSize = elements.iconSize.value;
      renderLegend();
      renderSubcategoryFilters();
      renderMarkers();
    });
    elements.refreshButton.addEventListener('click', () => loadData());
    elements.showAllButton.addEventListener('click', () => {
      openContentDrawer(getVisibleContents(), 'Todos los contenidos', `${getVisibleContents().length} contenido(s) visibles`);
    });
    elements.fitButton.addEventListener('click', fitVisibleMarkers);
    elements.toggleSidebarButton.addEventListener('click', toggleSidebar);
    elements.showSidebarButton.addEventListener('click', toggleSidebar);
    elements.toggleGridButton.addEventListener('click', () => setGridOpen(!state.isGridOpen));
    elements.gridFullscreenButton.addEventListener('click', () => setGridFullscreen(!state.isGridFullscreen));
    elements.closeGridButton.addEventListener('click', () => setGridOpen(false));
    elements.closeDrawerButton.addEventListener('click', closeContentDrawer);
    elements.drawerBackdrop.addEventListener('click', closeContentDrawer);
    elements.drawerBody.addEventListener('click', (event) => {
      const target = event.target.closest('[data-open-resource]');
      if (!target) return;
      openLightbox(target.dataset.openResource, target.dataset.resourceUrl, target.dataset.resourceTitle);
    });
    elements.contentGridBody.addEventListener('click', (event) => {
      const detailButton = event.target.closest('[data-open-testimony]');
      if (detailButton) {
        if (!detailButton.dataset.contentId) return;
        const item = getAllContents().find((content) =>
          content.__mediaType === detailButton.dataset.contentType &&
          String(content._id || content.id || '') === detailButton.dataset.contentId
        );
        if (!item) return;
        if (state.isGridFullscreen) setGridFullscreen(false);
        openContentDrawer([item], getMediaTitle(item), 'Ficha completa del testimonio');
        return;
      }

      const target = event.target.closest('[data-open-resource]');
      if (!target) return;
      openLightbox(target.dataset.openResource, target.dataset.resourceUrl, target.dataset.resourceTitle);
    });
    elements.closeLightboxButton.addEventListener('click', closeLightbox);
    elements.lightbox.addEventListener('click', (event) => {
      if (event.target === elements.lightbox || event.target === elements.lightboxBody) {
        closeLightbox();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !elements.lightbox.classList.contains('hidden')) {
        closeLightbox();
        return;
      }

      if (elements.drawer.classList.contains('open')) {
        if (event.key === 'Escape') {
          closeContentDrawer();
          return;
        }
        if (event.key === 'Tab') {
          const focusable = [...elements.drawer.querySelectorAll('a[href], button:not([disabled]), audio[controls], video[controls], [tabindex]:not([tabindex="-1"])')];
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
        return;
      }

      if (event.key === 'Escape' && state.isGridFullscreen) {
        setGridFullscreen(false);
      }
    });

    initMap();
    renderEventFilters();
    renderMediaTypeFilters();
    renderSubcategoryFilters();
    renderLegend();
    renderPickingPointState();
    loadData(false);
  </script>
</body>
</html>
